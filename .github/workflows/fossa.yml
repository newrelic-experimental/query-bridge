name: FOSSA Analysis

on:
  schedule:
    - cron: '24 19 * * 0'
  workflow_dispatch:

jobs:
  fossa-scan:
    runs-on: ${{ 'fossa' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run FOSSA analysis
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: |
          fossa analyze
