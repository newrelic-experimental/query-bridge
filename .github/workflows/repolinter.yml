# NOTE: This file should always be named `repolinter.yml` to allow
# workflow_dispatch to work properly
name: Repolinter Action

# NOTE: This workflow will ONLY check the default branch!
# Currently there is no elegant way to specify the default
# branch in the event filtering, so branches are instead
# filtered in the "Test Default Branch" step.
#
# The pull_request trigger is scoped to this file. On a pull request `github.ref`
# is refs/pull/N/merge, so the default-branch check below is false and the lint
# steps skip. That is intentional: the value is exercising the github-script call
# itself, which has broken across major versions (v8 moved the Octokit API under
# `github.rest`). A break surfaces in review instead of on master.
on:
  push:
    branches: [master]
  pull_request:
    paths: ['.github/workflows/repolinter.yml']
  workflow_dispatch:

jobs:
  repolint:
    name: Run Repolinter
    runs-on: ubuntu-latest
    steps:
      - name: Test Default Branch
        id: default-branch
        uses: actions/github-script@v9
        with:
          script: |
            const data = await github.rest.repos.get(context.repo)
            return data.data && data.data.default_branch === context.ref.split('/').slice(-1)[0]
      - name: Checkout Self
        if: ${{ steps.default-branch.outputs.result == 'true' }}
        uses: actions/checkout@v7
      - name: Run Repolinter
        if: ${{ steps.default-branch.outputs.result == 'true' }}
        uses: newrelic/repolinter-action@v1
        with:
          config_url: https://raw.githubusercontent.com/newrelic/.github/main/repolinter-rulesets/new-relic-experimental.yml
          output_type: issue
