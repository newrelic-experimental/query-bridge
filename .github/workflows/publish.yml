name: Publish

# Publishes @newrelic/query-bridge to npmjs.org via npm Trusted Publishing (OIDC).
# No npm token is used — npm verifies the publish came from this repo + this
# workflow file via an OIDC exchange. See:
#   https://docs.npmjs.com/trusted-publishers
#   https://newrelic.atlassian.net/wiki/spaces/NA/pages/4703551842 (NR process)
#
# Trusted-publisher config (set once, by the Node.js Agent team, on the package's
# npmjs.com Settings page — see handoff notes in the PR):
#   Organization:      newrelic-experimental
#   Repository:        query-bridge
#   Workflow filename: publish.yml   (this file; case-sensitive)
#
# Monorepo note: this is a workspaces repo. Only @newrelic/query-bridge is
# published here; @newrelic/dashboard-importer is private. If that ever changes,
# give each package its own publish workflow + tag scheme.

# Publishing is manual only. Bump packages/nr-query-bridge/package.json `version`,
# merge to master, then run this workflow from the Actions tab.
#
# The pull_request trigger is scoped to this file. Editing the publish path runs
# the `validate` job below, which exercises the same setup and build chain and
# then packs instead of publishing. Nothing can publish from a pull request: the
# two jobs are gated on mutually exclusive events.
on:
  pull_request:
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

# Permissions are declared per job, NOT at the top level. A pull_request run must
# never be able to mint an OIDC token or write to the repository.

jobs:
  # Pre-flight for changes to this file. Mirrors the publish job's setup and
  # build chain, asserts setup-node actually configured the registry, and packs
  # instead of publishing. `npm publish --dry-run` never authenticates and never
  # contacts the registry, so it validates packaging only. The Trusted Publishing
  # OIDC exchange cannot be rehearsed; the first real publish is its own test.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # setup-node's registry-url works by writing an .npmrc. Assert the effect
      # directly, so a change in that behavior fails here rather than during a
      # release. Trailing slash is normalized before comparing.
      - name: Assert setup-node configured the npm registry
        run: |
          actual="$(npm config get registry)"
          echo "npm registry: $actual"
          test "${actual%/}" = "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build:parsers
      - run: npm test
      - run: npm run build:types

      - name: Pack the published workspace (no registry contact)
        run: npm publish --dry-run --workspace @newrelic/query-bridge --access public

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag + GitHub release
      id-token: write # REQUIRED for the Trusted Publishing OIDC exchange
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          # Trusted Publishing requires npm >= 11.5.1, which ships with
          # Node.js >= 24.5.0. The registry-url must match on both ends of
          # the OIDC exchange.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - run: npm ci

      # build:parsers generates the SPL PEG parser; it is NOT covered by the
      # package's prepublishOnly hook, so run it explicitly before publishing.
      - run: npm run build:parsers
      - run: npm test
      - run: npm run build:types

      - name: Create tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r '.version' packages/nr-query-bridge/package.json)"
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag "v${version}"
          git push --tags
          gh release create "v${version}" --generate-notes

      # Tokenless publish of the single public workspace. `publishConfig.access`
      # is already "public" in the package.json; --access public is belt-and-suspenders.
      # npm auto-generates build provenance because id-token: write is set.
      - name: Publish to npm
        run: npm publish --workspace @newrelic/query-bridge --access public
