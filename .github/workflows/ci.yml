name: CI
# Manual-dispatch only until the github.com OSS migration. On GHE there are no
# Actions runners, so the pull_request/push triggers only pile up perpetually-
# queued `build` runs — and Grand Central's "Lint, Types & Tests" suite already
# runs the identical `npm ci && lint && types:check && test`. Re-add
# pull_request + push once the repo is public and hosted runners are available.
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run types:check
      - run: npm test
