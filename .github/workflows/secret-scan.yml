name: Secret Scan
# Scans the full git history for committed secrets with gitleaks, using the
# repo's .gitleaks.toml (upstream ruleset + New Relic key patterns ported from
# newrelic/rusty-hog).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history; gitleaks scans every commit

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose
