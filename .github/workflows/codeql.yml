name: CodeQL
# Manual-dispatch only until the github.com OSS migration. On GHE there are no
# Actions runners, and GitHub's default code-scanning setup already covers
# scanning — the auto-triggered advanced workflow only conflicts and fails.
on: [workflow_dispatch]
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
